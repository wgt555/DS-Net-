name: fetch-dsnet-dataset

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Install gdown
        run: python -m pip install --upgrade gdown

      - name: Download with retry
        shell: bash
        run: |
          set -x
          for i in 1 2 3 4 5; do
            python -m gdown "https://drive.google.com/uc?id=14RKHsmBdTRNrecDXCDgprgmaC6wRrGyL" -O dsnet.zip && break
            echo "attempt $i failed"; sleep 60
          done
          ls -lh dsnet.zip
          file dsnet.zip || true
          test -s dsnet.zip || { echo "下载为空"; exit 1; }

      - name: Verify zip
        run: |
          unzip -t dsnet.zip >/dev/null 2>&1 && echo "zip OK" || {
            echo "=== 不是有效 zip，前 600 字节 ==="; head -c 600 dsnet.zip; exit 1;
          }

      - name: Split if larger than 1.8GB
        run: |
          if [ "$(stat -c%s dsnet.zip)" -gt 1932735283 ]; then
            split -b 1800M -d dsnet.zip dsnet-part-
            rm -f dsnet.zip
          fi
          ls -lh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsnet-dataset
          path: |
            dsnet.zip
            dsnet-part-*
          if-no-files-found: error
          compression-level: 0
