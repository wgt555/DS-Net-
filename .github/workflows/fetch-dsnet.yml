name: fetch-dsnet-dataset

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Install gdown and h5py
        run: python -m pip install --upgrade gdown h5py

      - name: Download
        shell: bash
        run: |
          set -x
          python -m gdown "https://drive.google.com/uc?id=14RKHsmBdTRNrecDXCDgprgmaC6wRrGyL" -O download.bin
          ls -lh download.bin
          file download.bin || true

      - name: Detect and verify
        shell: bash
        run: |
          set -e
          if head -c 4 download.bin | grep -q HDF || file download.bin | grep -q "Hierarchical Data Format"; then
            mv download.bin pointcloud.h5
            echo "== HDF5 =="
            python -c "import h5py; f=h5py.File('pointcloud.h5','r'); ks=list(f)[:5]; print('samples:',len(f)); print('keys:',ks); k=ks[0]; print('points:',f[k]['points'].shape); print('labels:',f[k]['per_point_labels'].shape)"
          elif unzip -t download.bin >/dev/null 2>&1; then
            mv download.bin dsnet.zip
            echo "== zip =="
          else
            echo "unknown format"; head -c 300 download.bin; exit 1
          fi
          ls -lh

      - name: Split if larger than 1.8GB
        shell: bash
        run: |
          F=""
          [ -f pointcloud.h5 ] && F=pointcloud.h5
          [ -f dsnet.zip ] && F=dsnet.zip
          if [ -n "$F" ] && [ "$(stat -c%s "$F")" -gt 1932735283 ]; then
            split -b 1800M -d "$F" "${F}.part-"
            rm -f "$F"
          fi
          ls -lh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsnet-dataset
          path: |
            pointcloud.h5
            dsnet.zip
            *.part-*
          if-no-files-found: error
          compression-level: 0
